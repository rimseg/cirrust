name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    # The bundled WebKitGTK inherits the runner's version. 22.04's is too old
    # to initialise EGL on very new Mesa — the WebProcess aborts and the window
    # renders blank white. We track the newest available image so the bundled
    # WebKit stays current with modern GPU stacks; 26.04 is a preview runner but
    # its WebKit is contemporaneous with recent Mesa, which is exactly what the
    # blank-window fix needs. Trade-off: a higher glibc floor (~2.41), so the
    # AppImage needs a reasonably recent host. If the preview image is ever
    # unavailable, fall back to ubuntu-24.04 (the newest GA runner).
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          # bundleMediaFramework copies GStreamer's plugins into the AppImage,
          # so they have to exist on the runner first — without them WebKit gets
          # the GStreamer libraries but no decoders, and media never plays.
          # patchelf is not preinstalled and linuxdeploy's gstreamer plugin
          # exits 2 without it, failing the bundle step outright.
          sudo apt-get install -y patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Build & attach the AppImage
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          # Only the AppImage is shipped as a release asset. The Flatpak is built
          # separately (packaging/flatpak/build.sh) and .deb/.rpm are not provided.
          args: "--bundles appimage"
          tagName: ${{ github.ref_name }}
          releaseName: "Cirrust ${{ github.ref_name }}"
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's bundled strip breaks on modern .relr.dyn sections
          NO_STRIP: "true"
